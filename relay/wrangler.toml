# The photo upload relay. See README.md in this directory for deployment.
#
# Secrets are NOT in this file. Set each one once with `wrangler secret put`:
#
#   GITHUB_TOKEN      a fine-grained personal access token, scoped to this
#                     repository only, with "Contents: Read and write".
#                     Nothing else. Do not reuse a personal token.
#   ADMIN_SECRET      the password the gallery's remove button asks for. It is
#                     compared in the Worker and never sent to the browser, so
#                     unlike everything else about this relay it is a real
#                     credential: use a long random string, not a word. Rotate
#                     it with `wrangler secret put ADMIN_SECRET`. The site is
#                     static, so this secret is the ONLY thing authorising a
#                     takedown -- see relay/README.md.

name = "suas-photo-relay"
main = "src/worker.js"
# Wrangler 3 is pinned in package.json because the deployment machine runs
# Node 18 (wrangler 4 needs 22). This date is the newest one it knows.
compatibility_date = "2024-09-23"

[vars]
# Only this origin may post to the relay, so other sites cannot use it as a
# free upload service.
ALLOWED_ORIGIN = "https://usyd-astro.github.io"
GITHUB_REPO = "USYD-Astro/USYD-Astro"
# Uploads land on a branch Pages does not serve, then a GitHub Action turns
# them into published gallery entries. See .github/workflows/publish-submission.yml
SUBMISSIONS_BRANCH = "submissions"
BASE_BRANCH = "main"

[observability]
enabled = true
