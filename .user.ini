; PHP settings for the photo upload endpoint.
;
; cPanel's defaults on this host are upload_max_filesize 2M and post_max_size 8M.
; The form accepts up to eight photos of up to 12 MB each -- it sends the original
; file rather than a shrunk copy, so those are real numbers, not worst cases -- and
; a batch like that would be discarded by PHP before upload.php ever ran, leaving
; the endpoint to see an empty request and the visitor to see a failure with no
; explanation.
;
; .user.ini is honoured per-directory by PHP-FPM, which is what cPanel serves this
; account with. It is not a substitute for the checks in upload.php: this decides
; what PHP will hand over, not what the endpoint will accept and store.

upload_max_filesize = 16M
post_max_size = 128M
max_file_uploads = 20
memory_limit = 256M
