# Who sent which photos, and how to reach them.
#
# Committed on purpose: the committee needs this to follow up with members, and
# anyone with access to the repository can read it. It is NOT served with the
# site, because it lives in .contacts/ -- a dot-directory, which GitHub Pages
# does not publish. Do not move it to the root of the repository, and do not
# copy these addresses into assets/data/*.yml, which *is* published.
#
# Appended by tools/gallery.py and tools/publish_submissions.py. Safe to edit by
# hand; the next append rewrites the file from this list.
