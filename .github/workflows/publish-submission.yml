name: Publish photo submissions

# The upload relay commits each submission to a `submissions` branch, which
# Pages does not serve. This turns whatever is waiting there into gallery
# entries on main, using the same tools/gallery.py path a hand-added photo
# takes, and then clears the images off the submissions branch so they are not
# processed twice. `submission.json` deliberately stays behind: it holds the
# submitter's name and email, which must never reach the published site.
#
# Published submissions go to assets/data/submissions.yml and the rail on
# submit.html, NOT to the home page gallery, which stays a curated selection
# of photos. That also means submitted photos get no hero slide.
#
# Submissions publish automatically: the relay enforces consent, size, type and
# count. Photos arrive exactly as the submitter chose them, EXIF and all -- the
# re-encode that tools/gallery.py does below is what leaves that behind in the
# copies the site actually serves. To review submissions before they go live
# instead, delete the schedule below and keep workflow_dispatch.
#
# This runs from main, on a timer, and deliberately NOT on the push to
# `submissions` that starts the work. For a push event GitHub runs the copy of
# this file that lives on the pushed branch, and the queue branch is a fork of
# main that the relay only ever adds photos to -- so a push trigger runs
# whatever version of this workflow was current when the branch was created.
# That is exactly how a submitted photo came to be pushed without its manifest
# entry: the copy on the branch staged the image but not assets/data/
# submissions.yml or submit.html, so the photo went live unlisted and every
# later consistency check failed on it. For the same reason the queue branch
# carries no copy of this file at all now.

on:
  schedule:
    # The queue is a branch rather than an event, so a short poll is what
    # drains it. Five minutes is GitHub's floor, and runs can start late
    # under load, which is what the submit page's "within a few minutes"
    # promises.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-photo-submissions
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the gallery tooling
        run: pip install --quiet --disable-pip-version-check pillow pyyaml

      - name: Collect what is waiting on the submissions branch
        id: incoming
        run: |
          set -euo pipefail
          git fetch --quiet origin submissions
          mkdir -p /tmp/incoming
          git archive origin/submissions submissions | tar -x -C /tmp/incoming
          images() {
            find submissions -mindepth 2 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \
                 -o -iname '*.webp' -o -iname '*.heic' -o -iname '*.heif' \)
          }
          cd /tmp/incoming
          # The exact paths this run is about to publish. The clear step below
          # deletes these and nothing else, so an upload that arrives while the
          # job is running stays queued for the next run instead of being
          # thrown away unpublished.
          images > /tmp/processed.txt
          waiting=$(wc -l < /tmp/processed.txt)
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "$waiting photo(s) waiting"

      - name: Publish them into the gallery
        if: steps.incoming.outputs.waiting != '0'
        run: python3 tools/publish_submissions.py --incoming /tmp/incoming/submissions

      - name: Verify the gallery is consistent
        if: steps.incoming.outputs.waiting != '0'
        run: python3 tools/gallery.py check

      - name: Commit the published gallery
        if: steps.incoming.outputs.waiting != '0'
        run: |
          set -euo pipefail
          git config user.name "SUAS photo relay"
          git config user.email "usydastronomy@gmail.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          # One photo is two paths (the original and its thumbnail), so count
          # the originals rather than every changed path.
          added=$(git status --porcelain -- assets/img/events | grep -v '/thumbs/' | wc -l)
          git add assets/img/events assets/data/gallery.yml assets/data/submissions.yml submit.html index.html
          git commit -m "Publish $added submitted photo(s)"
          git push origin HEAD:main

      - name: Clear the processed photos from the submissions branch
        if: steps.incoming.outputs.waiting != '0'
        run: |
          set -euo pipefail
          git config user.name "SUAS photo relay"
          git config user.email "usydastronomy@gmail.com"
          # The relay commits photos and their details to the queue as they
          # arrive, so a push here can lose a race with it. Losing that race is
          # what left a published photo queued for a second publish, and the
          # duplicate that would have followed it, so this re-reads the branch
          # and tries again rather than giving up.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin submissions
            git checkout --quiet -B clear origin/submissions
            while read -r path; do
              rm -f -- "$path"
              # --cached so a queue that emptied completely still records the
              # deletion, and -f because submissions/ is gitignored in the
              # published tree.
              git rm -q -f --cached --ignore-unmatch -- "$path"
            done < /tmp/processed.txt
            if [ -z "$(git status --porcelain)" ]; then
              echo "nothing to clear"
              exit 0
            fi
            git commit --quiet -m "Clear processed photo submissions"
            if git push --quiet origin HEAD:submissions; then
              echo "cleared the published photos on attempt $attempt"
              exit 0
            fi
            echo "another commit landed on the queue; re-reading it"
            sleep 3
          done
          echo "could not clear the queue after 5 attempts" >&2
          exit 1
