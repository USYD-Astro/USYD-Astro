name: Publish photo submissions

# The upload relay commits each submission to a `submissions` branch, which
# Pages does not serve. This turns whatever is waiting there into gallery
# entries on main, using the same tools/gallery.py path a hand-added photo
# takes, and then clears the images off the submissions branch so they are not
# processed twice. `submission.json` deliberately stays behind: it holds the
# submitter's name and email, which must never reach the published manifests.
#
# Published submissions go to assets/data/submissions.yml and the rail on
# submit.html, NOT to the home page gallery, which stays a curated selection
# of photos. That also means submitted photos get no hero slide.
#
# Each submitter's name and email are also recorded in .contacts/contacts.yml,
# which IS committed to this branch so the committee can follow up. It is never
# served: GitHub Pages publishes the branch verbatim but skips dot-directories,
# so the addresses are reachable to anyone with repository access and to nobody
# on the web. Keep it that way -- nothing from .contacts may be copied into
# assets/data/, which is published.
#
# Submissions publish automatically: the relay enforces consent, size, type and
# count. Photos arrive exactly as the submitter chose them, EXIF and all -- the
# re-encode that tools/gallery.py does below is what leaves that behind in the
# copies the site actually serves. To review submissions before they go live
# instead, delete the triggers below and keep workflow_dispatch.
#
# Two triggers, on purpose. The relay asks for this workflow to run as soon as
# it has committed a submission, so a photo goes live in about a minute rather
# than in up to five; the schedule is the guarantee underneath that, and the
# one thing that still picks a submission up if a dispatch is refused, a token
# loses the permission, or the relay is unreachable. Deleting the dispatch to
# go back to a five-minute wait means deleting it in handler.js too.
#
# This runs from main, and deliberately NOT on the push to `submissions` that
# starts the work. For a push event GitHub runs the copy of this file that
# lives on the pushed branch, and the queue branch is a fork of main that the
# relay only ever adds photos to -- so a push trigger runs whatever version of
# this workflow was current when the branch was created. That is exactly how a
# submitted photo came to be pushed without its manifest entry: the copy on
# the branch staged the image but not assets/data/submissions.yml or
# submit.html, so the photo went live unlisted and every later consistency
# check failed on it. For the same reason the queue branch carries no copy of
# this file at all now. A repository_dispatch is a different animal: it is
# evaluated against the default branch, so this copy is the one that runs.

on:
  repository_dispatch:
    # Must match PUBLISH_EVENT in relay/src/handler.js.
    types: [photo-submitted]
  schedule:
    # The queue is a branch, not an event, so something has to poll it anyway.
    # Five minutes is GitHub's floor, and runs can start late under load --
    # which is the wait a submission falls back to if its dispatch does not
    # land.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-photo-submissions
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the gallery tooling
        run: pip install --quiet --disable-pip-version-check pillow pyyaml

      - name: Collect what is waiting on the submissions branch
        id: incoming
        run: |
          set -euo pipefail
          # The relay creates the queue branch lazily, on the first upload, so a
          # site with nothing submitted yet has no such branch -- and neither
          # does one where the branch was deleted to start clean. Running to
          # find an empty queue is the right answer; a red run every five
          # minutes until somebody uploads is not.
          if ! git ls-remote --exit-code --heads origin submissions >/dev/null 2>&1; then
            # Both outputs have to be set here. An output that is never written
            # reads back as an empty string, and `'' != '0'` is true -- so a
            # step guarded on it would run, and then read a list file this
            # step never got as far as creating. That is the same class of
            # empty-queue failure the block below was written to avoid.
            echo "waiting=0" >> "$GITHUB_OUTPUT"
            echo "takedowns=0" >> "$GITHUB_OUTPUT"
            echo "no queue branch yet"
            exit 0
          fi
          git fetch --quiet origin submissions
          mkdir -p /tmp/incoming
          # The queue legitimately holds nothing most of the time, and a
          # freshly created queue branch has no submissions directory at all:
          # submissions/ is gitignored in the published tree, so a branch cut
          # from main starts without it. An empty queue has to be a clean
          # no-op, because both a bare `git archive` and a `find` over a
          # missing path exit non-zero and set -e would fail the run.
          if git cat-file -e origin/submissions:submissions 2>/dev/null; then
            git archive origin/submissions submissions | tar -x -C /tmp/incoming
          fi
          # Removal requests queue in their own directory, so a takedown is
          # never blocked by a half-finished publish of a new submission.
          if git cat-file -e origin/submissions:moderate 2>/dev/null; then
            git archive origin/submissions moderate | tar -x -C /tmp/incoming
          fi
          images() {
            [ -d submissions ] || return 0
            find submissions -mindepth 2 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \
                 -o -iname '*.webp'                 -o -iname '*.heic' -o -iname '*.heif' \)
          }
          removals() {
            [ -d moderate ] || return 0
            find moderate -type f -name '*.json'
          }
          cd /tmp/incoming
          # The exact paths this run is about to publish. The clear step below
          # deletes these and nothing else, so an upload that arrives while the
          # job is running stays queued for the next run instead of being
          # thrown away unpublished.
          images > /tmp/processed.txt
          # A removal request is cleared only once it has been applied, and only
          # by the clear step at the end -- so if the run dies in between the
          # request is still queued and the next run tries again. Applying one
          # twice is harmless; silently dropping one is not.
          removals > /tmp/removals.txt
          waiting=$(wc -l < /tmp/processed.txt)
          takedowns=$(wc -l < /tmp/removals.txt)
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "takedowns=$takedowns" >> "$GITHUB_OUTPUT"
          echo "$waiting photo(s) waiting, $takedowns removal request(s)"

      - name: Publish them into the gallery
        if: steps.incoming.outputs.waiting != '0'
        run: python3 tools/publish_submissions.py --incoming /tmp/incoming/submissions

      - name: Apply the queued removals
        if: steps.incoming.outputs.takedowns != '0'
        run: |
          python3 tools/publish_submissions.py \
            --removals /tmp/incoming/moderate \
            --removals-only

      - name: Verify the gallery is consistent
        if: steps.incoming.outputs.waiting != '0' || steps.incoming.outputs.takedowns != '0'
        run: python3 tools/gallery.py check

      - name: Commit the published gallery
        if: steps.incoming.outputs.waiting != '0' || steps.incoming.outputs.takedowns != '0'
        run: |
          set -euo pipefail
          git config user.name "SUAS photo relay"
          git config user.email "usydastronomy@gmail.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          # One photo is two paths (the original and its thumbnail), so count
          # the originals rather than every changed path.
          added=$(git status --porcelain -- assets/img/events | grep -v '/thumbs/' | wc -l)
          removed=$(git status --porcelain -- assets/img/events | grep -c '^ D' || true)
          # .contacts is the submitter contact log. It has to be staged here or
          # every automated run would record addresses it then drops, leaving
          # the committee with no way to reply to anyone.
          # .contacts is the submitter contact log and removal log. It has to be
          # staged here or every automated run would record entries it then
          # drops, leaving the committee with no way to reply to anyone and no
          # record of what was taken down and why. It is a separate add because
          # it is the one path that may not exist yet: git add fails outright on
          # a pathspec matching nothing, which under set -e would fail the run
          # over a missing log directory.
          git add assets/img/events assets/data/gallery.yml assets/data/submissions.yml submit.html index.html
          git add .contacts 2>/dev/null || true
          if [ "$removed" -gt 0 ]; then
            git commit -m "Remove $removed photo(s) from the gallery"
          else
            git commit -m "Publish $added submitted photo(s)"
          fi
          git push origin HEAD:main

      - name: Clear the processed photos from the submissions branch
        if: steps.incoming.outputs.waiting != '0' || steps.incoming.outputs.takedowns != '0'
        run: |
          set -euo pipefail
          git config user.name "SUAS photo relay"
          git config user.email "usydastronomy@gmail.com"
          # The relay commits photos and their details to the queue as they
          # arrive, so a push here can lose a race with it. Losing that race is
          # what left a published photo queued for a second publish, and the
          # duplicate that would have followed it, so this re-reads the branch
          # and tries again rather than giving up.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin submissions
            git checkout --quiet -B clear origin/submissions
            while read -r path; do
              rm -f -- "$path"
              # --cached so a queue that emptied completely still records the
              # deletion, and -f because submissions/ is gitignored in the
              # published tree.
              git rm -q -f --cached --ignore-unmatch -- "$path"
            done < /tmp/processed.txt
            # Removal requests go only after they have been applied, which is
            # why this reads a second list: a takedown that has not happened
            # yet must stay queued rather than be cleared as if it had. The
            # file may not exist at all if the collect step found no queue
            # branch, so it is touched first rather than assumed.
            touch /tmp/removals.txt
            while read -r path; do
              rm -f -- "$path"
              git rm -q -f --cached --ignore-unmatch -- "$path"
            done < /tmp/removals.txt
            if [ -z "$(git status --porcelain)" ]; then
              echo "nothing to clear"
              exit 0
            fi
            git commit --quiet -m "Clear processed photo submissions"
            if git push --quiet origin HEAD:submissions; then
              echo "cleared the published photos on attempt $attempt"
              exit 0
            fi
            echo "another commit landed on the queue; re-reading it"
            sleep 3
          done
          echo "could not clear the queue after 5 attempts" >&2
          exit 1
