# Who sent which photos, and how to reach them.
#
# For the committee, not for the public. This file lives on the `contacts`
# branch, which GitHub Pages does not deploy, so it is readable by anyone with
# access to the repository and served to nobody.
#
# It must never be committed to main. Everything on main is published, and
# Pages serves dot-directories like this one in plain text -- a dot-directory
# is not a hiding place.
#
# Appended by tools/gallery.py and tools/publish_submissions.py. Safe to edit by
# hand; the next append rewrites the file from this list.
